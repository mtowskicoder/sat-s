<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTOW Market</title>

<style>
:root{
  --bg:#0b1020;
  --card:#141c3a;
  --accent:#7c4dff;
  --text:#eef1ff;
  --muted:#9aa4c7;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Arial;
  background:linear-gradient(-45deg,#050b18,#1b1450,#050b18);
  background-size:400% 400%;
  animation:bg 14s infinite;
  color:var(--text);
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:900;
  color:var(--accent);
}

/* PAGES */
.page{display:none;padding:16px}
.page.active{display:block}

/* HOME */
.announce{
  background:var(--card);
  border-radius:16px;
  padding:12px;
}
.announce img{
  width:100%;
  border-radius:12px;
  max-height:220px;
  object-fit:cover;
}
.announce h3{
  margin:10px 0 0;
  font-size:16px;
}

.homeBottom{
  margin-top:40px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.catBtn{
  width:90px;
  height:90px;
  border-radius:50%;
  background:linear-gradient(135deg,#7c4dff,#38bdf8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  box-shadow:0 0 35px rgba(124,77,255,.7);
  cursor:pointer;
}

/* CATEGORIES */
.catGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.catCard{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  text-align:center;
  cursor:pointer;
}
.catCard img{
  width:70px;
  height:70px;
  object-fit:contain;
}

/* PRODUCTS */
.prodGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:12px;
}
.card img{
  width:100%;
  height:120px;
  object-fit:contain;
}
.price{
  color:#2dd4bf;
  font-weight:900;
}
button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:0;
  background:var(--accent);
  color:white;
  font-weight:900;
}

.back{
  margin-bottom:12px;
  color:var(--muted);
  cursor:pointer;
}

/* BUY POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.popupBox{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:320px;
  text-align:center;
}
.popupBox button{
  margin-top:10px;
}
.wa{background:#25D366;color:#002b12}
.tg{background:#229ED9;color:#021018}
</style>
</head>

<body>

<header>MTOW MARKET</header>

<!-- HOME -->
<section id="home" class="page">
  <div class="announce" id="announce"></div>

  <div class="homeBottom">
    <div class="catBtn" onclick="goCategories()">🛒</div>
    <div style="margin-top:8px;color:var(--muted)">Kategoriler</div>
  </div>
</section>

<!-- CATEGORIES -->
<section id="categories" class="page">
  <div class="back" onclick="goHome()">← Geri</div>
  <div class="catGrid" id="catGrid"></div>
</section>

<!-- PRODUCTS -->
<section id="products" class="page">
  <div class="back" onclick="goCategories()">← Geri</div>
  <h2 id="prodTitle"></h2>
  <div class="prodGrid" id="prodGrid"></div>
</section>

<!-- BUY POPUP -->
<div class="popup" id="popup">
  <div class="popupBox">
    <h3 id="popupTitle"></h3>
    <button class="wa" id="waBtn">WhatsApp</button>
    <button class="tg" id="tgBtn">Telegram</button>
    <button onclick="closePopup()">İptal</button>
  </div>
</div>

<script>
/* CONFIG */
const PRODUCTS_URL = "data/products.json";
const ANNOUNCE_URL = "data/announcements.json";
const WHATSAPP = "https://wa.me/6282261958495";
const TELEGRAM = "https://t.me/mtow1";

/* STATE */
let DATA = {};
let CURRENT_PRODUCT = "";
let CURRENT_CATEGORY = null;

/* PAGE CONTROL + PERSIST */
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  localStorage.setItem("mtow_page", id);
  if(CURRENT_CATEGORY) localStorage.setItem("mtow_category", CURRENT_CATEGORY);
}

function goHome(){
  CURRENT_CATEGORY = null;
  localStorage.removeItem("mtow_category");
  showPage("home");
}

function goCategories(){
  showPage("categories");
}

/* ANNOUNCEMENT */
fetch(ANNOUNCE_URL)
.then(r=>r.json())
.then(a=>{
  announce.innerHTML = `
    <img src="${a.gif}">
    <h3>${a.text}</h3>
  `;
});

/* LOAD PRODUCTS */
fetch(PRODUCTS_URL)
.then(r=>r.json())
.then(d=>{
  DATA = d;
  renderCategories();
  restoreState();
});

/* CATEGORIES */
function renderCategories(){
  catGrid.innerHTML="";
  Object.keys(DATA).forEach(key=>{
    const c = DATA[key];
    const div = document.createElement("div");
    div.className="catCard";
    div.innerHTML=`
      <img src="${c.icon}">
      <div>${c.title}</div>
    `;
    div.onclick=()=>openProducts(key);
    catGrid.appendChild(div);
  });
}

/* PRODUCTS */
function openProducts(key){
  CURRENT_CATEGORY = key;
  showPage("products");
  prodTitle.innerText = DATA[key].title;
  prodGrid.innerHTML="";

  DATA[key].items.forEach(p=>{
    const d = document.createElement("div");
    d.className="card";
    d.innerHTML=`
      <img src="${p.gif}">
      <div>${p.name}</div>
      <div class="price">${p.price}</div>
      <button onclick="buy('${p.name}','${p.price}')">Satın Al</button>
    `;
    prodGrid.appendChild(d);
  });
}

/* BUY */
function buy(name,price){
  CURRENT_PRODUCT = `Ürün: ${name}\nFiyat: ${price}`;
  popup.style.display="flex";
  popupTitle.innerText = name;
}
function closePopup(){
  popup.style.display="none";
}
waBtn.onclick=()=>window.open(`${WHATSAPP}?text=${encodeURIComponent(CURRENT_PRODUCT)}`);
tgBtn.onclick=()=>window.open(`${TELEGRAM}?text=${encodeURIComponent(CURRENT_PRODUCT)}`);

/* RESTORE PAGE AFTER REFRESH */
function restoreState(){
  const page = localStorage.getItem("mtow_page") || "home";
  const cat = localStorage.getItem("mtow_category");

  if(page === "products" && cat && DATA[cat]){
    openProducts(cat);
  }else{
    showPage(page);
  }
}

/* DEFAULT */
showPage("home");
</script>

</body>
</html>
